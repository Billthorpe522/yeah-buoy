<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="YB">
  <!-- background tile (rounded square in brand orange) -->
  <rect width="64" height="64" rx="10" fill="#E8612C"/>
  <!-- top hairline -->
  <line x1="6" y1="10" x2="58" y2="10" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- buoy shape: top white band, orange body, white base -->
  <ellipse cx="32" cy="22" rx="14" ry="3.5" fill="#FAF1DC"/>
  <rect x="18" y="22" width="28" height="18" fill="#1A1A1A"/>
  <ellipse cx="32" cy="40" rx="14" ry="3.5" fill="#FAF1DC"/>
  <!-- centerline through the buoy -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#E8612C" stroke-width="2"/>
  <!-- bail (top arc) -->
  <path d="M 26 14 Q 32 6 38 14" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- wave under -->
  <path d="M 6 50 q 6 -3 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- wordmark dots in the corners -->
  <circle cx="14" cy="14" r="1.5" fill="#1A1A1A"/>
  <circle cx="50" cy="14" r="1.5" fill="#1A1A1A"/>
</svg>